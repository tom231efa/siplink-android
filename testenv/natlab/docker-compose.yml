# The NAT lab of SipLink: a PBX behind a NAT box whose behaviour the tests switch at run time
# (cone or symmetric mapping, UDP to port 5060 blocked, IP fragments dropped, short UDP
# timeouts, a SIP ALG), and a STUN server next to the PBX.
#
#   client 172.31.251.0/24   reachable from this host, and so from an emulator running on it
#     natc  172.31.251.2       SIP 5060 udp+tcp, 5062/udp and 5064/udp, RTP 22000-22099/udp, AMI 5038/tcp
#                              and STUN 3478/udp lead on to the PBX and the STUN server; the box
#                              takes commands on 7000/tcp (see tools/ctl.go)
#   inet   172.31.252.0/24   internal: only through the box, from this host as well
#     natc  172.31.252.2       the address the PBX sees every client at
#     pbx   172.31.252.10      accounts and numbers: see pbx/entrypoint.sh
#     stun  172.31.252.20
#
# Nothing is published on the host, unless LAN_ADDRESS is set for ./up.sh: then the box's ports
# are published on that address of the host for a phone on the local network
# (docker-compose.lan.yml). Run the tests with ./run.sh.
name: siplink-natlab

services:
  natc:
    build: ./tools
    image: siplink-natlab-tools:local
    command: ["ctl", "172.31.251.2:7000"]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      CLIENT_ADDRESS: 172.31.251.2
      INET_ADDRESS: 172.31.252.2
      PBX_ADDRESS: 172.31.252.10
      STUN_ADDRESS: 172.31.252.20
    networks:
      client:
        ipv4_address: 172.31.251.2
      inet:
        ipv4_address: 172.31.252.2

  pbx:
    # The image of the test PBX (testenv/asterisk), under a name of the lab's own: see up.sh.
    image: siplink-natlab-asterisk:local
    entrypoint: ["/natlab-entrypoint.sh"]
    environment:
      SIP_PASSWORD: ${SIP_PASSWORD:?run ./up.sh}
      AMI_USER: ${AMI_USER:?run ./up.sh}
      AMI_SECRET: ${AMI_SECRET:?run ./up.sh}
      LAB_ADDRESS: 172.31.251.2
      LAB_SIP_PORT: "5060"
      LAB_SIGNALLING_PORT: "5064"
      PBX_ADDRESS: 172.31.252.10
    volumes:
      - ./pbx/entrypoint.sh:/natlab-entrypoint.sh:ro
    networks:
      inet:
        ipv4_address: 172.31.252.10

  stun:
    image: siplink-natlab-tools:local
    depends_on: [natc]
    command: ["stun", "0.0.0.0:3478"]
    networks:
      inet:
        ipv4_address: 172.31.252.20

networks:
  client:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.251.0/24
  inet:
    driver: bridge
    internal: true
    # Without it this host has an address on the network, and an emulator on this host reaches
    # the PBX around the box (Docker: gateway modes, "isolated" needs an internal network).
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.31.252.0/24
