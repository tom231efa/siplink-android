; Behaviour of the scripted desk phones 1002-1005.
;
; Being called (the extension is the phone that rings):
;   1002, 1003   answer and stay silent; report what they hear through TALK_DETECT, which
;                raises the AMI events ChannelTalkingStart / ChannelTalkingStop. A test makes
;                one of them talk (a tone) by redirecting its channel to the priority "talk"
;   1004         answers and echoes the caller
;   1005         rings and never answers
;
; Calling out is done by the tests through AMI Originate on this instance:
;   Channel: PJSIP/<number>@as-<phone>     places the call through the PBX as <phone>
;   Context: apps, Exten: silent | tone | echo   what the phone does once the call is answered

[general]
static = yes
writeprotect = yes

[phones]
exten => _100[23],1,Answer()
 same => n,Set(TALK_DETECT(set)=1000,256)
 same => n,Wait(900)
 same => n,Hangup()
 same => n(talk),Milliwatt()
 same => n,Hangup()

exten => 1004,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 1005,1,Ringing()
 same => n,Wait(120)
 same => n,Hangup()

[apps]
exten => silent,1,Answer()
 same => n,Set(TALK_DETECT(set)=1000,256)
 same => n,Wait(900)
 same => n,Hangup()

; Talks (a 1004 Hz tone) and still reports what it hears.
exten => tone,1,Answer()
 same => n,Set(TALK_DETECT(set)=1000,256)
 same => n,Milliwatt()
 same => n,Hangup()

exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()
