; Dialplan of the SipLink test PBX.
;
; The feature codes below are the defaults of the app (Settings > 企业功能码):
;   700          park the current call (blind transfer target), slots 701-720
;   *80<ext>     intercom / paging: asks the phone to answer automatically
;   *91<ext>     listen to the calls of <ext>          (监听)
;   *92<ext>     whisper to <ext> only                 (耳语 / 密语)
;   *93<ext>     barge into the call of <ext>          (强插)
;   *94<ext>     force the calls of <ext> to hang up   (强拆)
;   **<ext>      pick up a call ringing at <ext>       (代接)
;   *8           pick up a call ringing in the group   (同组代接)
;   *97          voicemail of the calling extension
;   *78 / *79    do not disturb of the calling extension on / off, kept by the PBX
; While listening / whispering / barging, DTMF 4 / 5 / 6 switches between the three modes.

[general]
static = yes
writeprotect = yes

[globals]
; Address the phones reach this PBX at (fixed in docker-compose.yml).
PBX_ADDRESS = 172.31.250.10

[internal]
include => parkedcalls

; ---- phones: the app registers as 1001-1100 ----
exten => _1XXX,1,NoOp(Call to ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($[${DB_EXISTS(DND/${EXTEN})}]?dnd)
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,NoOp(Dial status ${DIALSTATUS})
 same => n,Hangup()
 same => n(dnd),Busy(5)
 same => n,Hangup()

; ---- do not disturb kept by the PBX (the codes FreePBX uses) ----
exten => *78,1,Answer()
 same => n,Set(DB(DND/${CALLERID(num)})=YES)
 same => n,Wait(1)
 same => n,Hangup()

exten => *79,1,Answer()
 same => n,NoOp(${DB_DELETE(DND/${CALLERID(num)})})
 same => n,Wait(1)
 same => n,Hangup()

; ---- scripted parties used by the tests ----
exten => 2000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 2001,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

exten => 2002,1,Answer()
 same => n,Wait(600)
 same => n,Hangup()

exten => 2003,1,Ringing()
 same => n,Wait(90)
 same => n,Hangup()

exten => 2004,1,Busy(5)
 same => n,Hangup()

; A code with a "#", which a SIP URI has to escape.
exten => #9,1,Answer()
 same => n,Wait(600)
 same => n,Hangup()

; Reports the DTMF digits it receives.
exten => 2010,1,Answer()
 same => n,Read(DIGITS,,4,,1,20)
 same => n,UserEvent(SipLinkDtmf,Digits: ${DIGITS})
 same => n,Wait(1)
 same => n,Hangup()

; Reports the auto-answer headers of the INVITE it receives.
exten => 2020,1,NoOp()
 same => n,Set(CI=${PJSIP_HEADER(read,Call-Info)})
 same => n,Set(AI=${PJSIP_HEADER(read,Alert-Info)})
 same => n,Set(AM=${PJSIP_HEADER(read,Answer-Mode)})
 same => n,UserEvent(SipLinkHeaders,CallInfo: ${CI},AlertInfo: ${AI},AnswerMode: ${AM})
 same => n,Answer()
 same => n,Wait(3)
 same => n,Hangup()

; Answers, then asks the caller to call 2000 instead (REFER sent by the PBX). chan_pjsip puts
; the argument into the Refer-To header as it is, so it has to be a complete SIP URI.
; Used by PbxReferTest only, which explains why the PBX has to be restarted afterwards.
exten => 2030,1,Answer()
 same => n,Wait(3)
 same => n,Transfer(sip:2000@${PBX_ADDRESS})
 same => n,NoOp(Transfer status ${TRANSFERSTATUS})
 same => n,Wait(5)
 same => n,Hangup()

; Members of a conference room (ConferenceTest). Each number is a party of its own: the app does
; not call one address twice. 2500-2599 answer at once, 2600-2699 ring for a while first. Every
; member beeps now and then, which the others hear through the app's mixer, and reports what it
; hears through TALK_DETECT (AMI events ChannelTalkingStart / ChannelTalkingStop). Not the echo
; of 2000: with many members the echoes would feed back.
; The app learns their names from the connected line (P-Asserted-Identity, sent only with a
; number in it); 2599 has a long one.
exten => _25XX,1,Set(CONNECTEDLINE(num,i)=${EXTEN})
 same => n,Set(CONNECTEDLINE(name,i)=成员${EXTEN:2})
 same => n,Answer()
 same => n(member),Set(TALK_DETECT(set)=1000,256)
 same => n,PlayTones(1400/150,0/2850)
 same => n,Wait(3600)
 same => n,Hangup()

exten => 2599,1,Set(CONNECTEDLINE(num,i)=${EXTEN})
 same => n,Set(CONNECTEDLINE(name,i)=Participant with a rather long display name 2599)
 same => n,Answer()
 same => n,Goto(2500,member)

exten => _26XX,1,Set(CONNECTEDLINE(num,i)=${EXTEN})
 same => n,Set(CONNECTEDLINE(name,i)=成员${EXTEN:1})
 same => n,Ringing()
 same => n,Wait(6)
 same => n,Answer()
 same => n,Goto(2500,member)

; Members that keep the app waiting before they answer, without ringing (27XX: two seconds), that
; the PBX turns away as if it had no line left (28XX: 503), and that are busy (29XX: 486)
; (ConferencePacingTest).
exten => _27XX,1,Set(CONNECTEDLINE(num,i)=${EXTEN})
 same => n,Set(CONNECTEDLINE(name,i)=成员${EXTEN:1})
 same => n,Wait(2)
 same => n,Answer()
 same => n,Goto(2500,member)

exten => _28XX,1,Congestion()

; As FreePBX answers a call over an extension's limit of calls at once: it plays an announcement
; and hangs up (24XX: answered after two seconds, ended one second later) (ConferencePacingTest).
exten => _24XX,1,Wait(2)
 same => n,Answer()
 same => n,PlayTones(425/500,0/500)
 same => n,Wait(1)
 same => n,Hangup()

exten => _29XX,1,Busy()

; Bridged versions of the parties above (transfer and parking need a real bridge).
exten => _300X,1,Dial(Local/200${EXTEN:3}@internal,90)
 same => n,Hangup()

; ---- intercom / paging ----
exten => _*80X.,1,Dial(PJSIP/${EXTEN:3},20,b(autoanswer^s^1))
 same => n,Hangup()

; ---- supervisor features ----
exten => _*91X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdES)
 same => n,Hangup()

exten => _*92X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdwES)
 same => n,Hangup()

exten => _*93X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdBES)
 same => n,Hangup()

exten => _*94X.,1,Answer()
 same => n,SoftHangup(PJSIP/${EXTEN:3},a)
 same => n,Wait(1)
 same => n,Hangup()

; ---- call pickup ----
; Test-only: 3003 rings a scripted party that never answers, **3003 picks that call up.
exten => **3003,1,PickupChan(Local/2003@internal,p)
 same => n,Hangup()

exten => _**1XXX,1,PickupChan(PJSIP/${EXTEN:2},p)
 same => n,Hangup()

exten => *8,1,Pickup()
 same => n,Hangup()

; ---- voicemail ----
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

exten => _*98X.,1,Answer()
 same => n,VoiceMail(${EXTEN:3}@default,s)
 same => n,Hangup()

;---- video, used by VideoCallTest ----
; The test calls the app through AMI Originate on this PBX with "Codecs" including vp8 / h264,
; so that the call offers video; what follows the answer is set here.
[videotests]
; Echoes what the app sends, its video included.
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Once answered asks the app to add video (re-INVITE with a video stream), then echoes.
exten => upgrade,1,Answer()
 same => n,Wait(3)
 same => n,Set(PJSIP_MEDIA_OFFER(video)=vp8)
 same => n,Set(PJSIP_SEND_SESSION_REFRESH()=invite)
 same => n,Echo()
 same => n,Hangup()

; An intercom call to <ext> that offers video: Originate Channel: Local/<ext>@videointercom
[videointercom]
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20,b(autoanswer^s^1))
 same => n,Hangup()

[autoanswer]
exten => s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:pbx.siplink.test>\;answer-after=0)
 same => n,Return()
