; Dialplan of the SipLink test PBX.
;
; The feature codes below are the defaults of the app (Settings > 企业功能码):
;   700          park the current call (blind transfer target), slots 701-720
;   *80<ext>     intercom / paging: asks the phone to answer automatically
;   *91<ext>     listen to the calls of <ext>          (监听)
;   *92<ext>     whisper to <ext> only                 (耳语 / 密语)
;   *93<ext>     barge into the call of <ext>          (强插)
;   *94<ext>     force the calls of <ext> to hang up   (强拆)
;   **<ext>      pick up a call ringing at <ext>       (代接)
;   *8           pick up a call ringing in the group   (同组代接)
;   *97          voicemail of the calling extension
; While listening / whispering / barging, DTMF 4 / 5 / 6 switches between the three modes.

[general]
static = yes
writeprotect = yes

[globals]
; Address the phones reach this PBX at (fixed in docker-compose.yml).
PBX_ADDRESS = 172.31.250.10

[internal]
include => parkedcalls

; ---- phones: the app registers as 1001-1100 ----
exten => _1XXX,1,NoOp(Call to ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,NoOp(Dial status ${DIALSTATUS})
 same => n,Hangup()

; ---- scripted parties used by the tests ----
exten => 2000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 2001,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

exten => 2002,1,Answer()
 same => n,Wait(600)
 same => n,Hangup()

exten => 2003,1,Ringing()
 same => n,Wait(90)
 same => n,Hangup()

exten => 2004,1,Busy(5)
 same => n,Hangup()

; Reports the DTMF digits it receives.
exten => 2010,1,Answer()
 same => n,Read(DIGITS,,4,,1,20)
 same => n,UserEvent(SipLinkDtmf,Digits: ${DIGITS})
 same => n,Wait(1)
 same => n,Hangup()

; Reports the auto-answer headers of the INVITE it receives.
exten => 2020,1,NoOp()
 same => n,Set(CI=${PJSIP_HEADER(read,Call-Info)})
 same => n,Set(AI=${PJSIP_HEADER(read,Alert-Info)})
 same => n,Set(AM=${PJSIP_HEADER(read,Answer-Mode)})
 same => n,UserEvent(SipLinkHeaders,CallInfo: ${CI},AlertInfo: ${AI},AnswerMode: ${AM})
 same => n,Answer()
 same => n,Wait(3)
 same => n,Hangup()

; Answers, then asks the caller to call 2000 instead (REFER sent by the PBX). chan_pjsip puts
; the argument into the Refer-To header as it is, so it has to be a complete SIP URI.
; Used by PbxReferTest only, which explains why the PBX has to be restarted afterwards.
exten => 2030,1,Answer()
 same => n,Wait(3)
 same => n,Transfer(sip:2000@${PBX_ADDRESS})
 same => n,NoOp(Transfer status ${TRANSFERSTATUS})
 same => n,Wait(5)
 same => n,Hangup()

; Bridged versions of the parties above (transfer and parking need a real bridge).
exten => _300X,1,Dial(Local/200${EXTEN:3}@internal,90)
 same => n,Hangup()

; ---- intercom / paging ----
exten => _*80X.,1,Dial(PJSIP/${EXTEN:3},20,b(autoanswer^s^1))
 same => n,Hangup()

; ---- supervisor features ----
exten => _*91X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdES)
 same => n,Hangup()

exten => _*92X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdwES)
 same => n,Hangup()

exten => _*93X.,1,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qdBES)
 same => n,Hangup()

exten => _*94X.,1,Answer()
 same => n,SoftHangup(PJSIP/${EXTEN:3},a)
 same => n,Wait(1)
 same => n,Hangup()

; ---- call pickup ----
; Test-only: 3003 rings a scripted party that never answers, **3003 picks that call up.
exten => **3003,1,PickupChan(Local/2003@internal,p)
 same => n,Hangup()

exten => _**1XXX,1,PickupChan(PJSIP/${EXTEN:2},p)
 same => n,Hangup()

exten => *8,1,Pickup()
 same => n,Hangup()

; ---- voicemail ----
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

exten => _*98X.,1,Answer()
 same => n,VoiceMail(${EXTEN:3}@default,s)
 same => n,Hangup()

[autoanswer]
exten => s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:pbx.siplink.test>\;answer-after=0)
 same => n,Return()
