; Transports of the test PBX. The container sits on a private Docker bridge, so nothing here
; is reachable from outside the host unless docker-compose.lan.yml publishes it.
[global]
type = global
user_agent = SipLink-TestPBX
endpoint_identifier_order = username,ip

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /certs/server.crt.pem
priv_key_file = /certs/server.key
method = tlsv1_2

; Written by entrypoint.sh: empty, or the address the transports announce to the local network.
#include pjsip_lan.conf
