{{define "content"}}
<section class="login">
  <div class="login-brand">{{template "brand-mark"}}<span>SipLink</span></div>
  <div class="card login-card">
    <h1>{{t "login.heading"}}</h1>
    <form method="post" action="/login" class="form">
      {{with .Data.Error}}<div class="flash error" role="alert">{{.}}</div>{{end}}
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <label>{{t "common.username"}}<input name="username" value="{{.Data.Username}}" autocomplete="username" dir="ltr" required autofocus></label>
      <label>{{t "common.password"}}<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary wide login-submit">{{t "login.submit"}}</button>
    </form>
  </div>
  <p class="login-foot"><span>{{t "app.name"}} {{.Version}}</span>{{template "repo-link"}}</p>
  {{template "lang-switch" .}}
</section>
{{end}}
