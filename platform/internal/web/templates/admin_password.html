{{define "content"}}
<div class="narrow-page">
<header class="page-head"><div><h1 dir="auto" class="fade">{{.Title}}</h1></div></header>
<section class="card secret-card">
  <div class="card-body">
    <span class="card-label">{{t "admins.password.label" "name" .Data.Admin.Username}}</span>
    <div class="secret-row"><span class="secret-once" id="once">{{.Data.Password}}</span><button type="button" class="btn" data-copy="#once" hidden>{{icon "copy"}}<span>{{t "common.copy"}}</span></button></div>
    <div class="flash warn">{{t "admins.password.once"}}</div>
  </div>
  <div class="card-foot form-actions"><a class="btn" href="/admins">{{t "admins.password.back"}}</a></div>
</section>
</div>
{{end}}
