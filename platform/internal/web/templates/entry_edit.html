{{define "content"}}
{{$d := .Data}}
<div class="narrow-page">
<header class="page-head"><div><h1 class="fade">{{.Title}}</h1><p class="page-sub fade"><a href="/books/{{$d.Book.ID}}">{{$d.Book.Name}}</a></p></div></header>
{{with $d.Errors}}<div class="flash error" role="alert"><ul class="errors">{{range .}}<li>{{.}}</li>{{end}}</ul></div>{{end}}
<form method="post" action="{{if $d.New}}/books/{{$d.Book.ID}}/entries{{else}}/books/{{$d.Book.ID}}/entries/{{$d.Entry.ID}}{{end}}" class="card form-card">
  <div class="card-body form">
    <label>{{t "books.field.name"}}<input name="name" value="{{$d.Entry.Name}}" required maxlength="64"></label>
    <div class="grid2">
      <label>{{t "books.field.surname"}}<input name="surname" value="{{$d.Entry.Surname}}" maxlength="64"></label>
      <label>{{t "books.field.given_name"}}<input name="given_name" value="{{$d.Entry.GivenName}}" maxlength="64"></label>
    </div>
    <div class="grid2">
      <div class="field"><span class="label-line"><label for="f-phones">{{t "books.field.phone"}}</label>{{tip "f-phones-tip" (t "dirs.entry.numbers_tip")}}</span><input id="f-phones" aria-describedby="f-phones-tip" name="phones" value="{{$d.Phones}}" dir="ltr"></div>
      <div class="field"><span class="label-line"><label for="f-mobiles">{{t "books.field.mobile"}}</label>{{tip "f-mobiles-tip" (t "dirs.entry.numbers_tip")}}</span><input id="f-mobiles" aria-describedby="f-mobiles-tip" name="mobiles" value="{{$d.Mobiles}}" dir="ltr"></div>
    </div>
    <div class="grid2">
      <label>{{t "books.field.organization"}}<input name="organization" value="{{$d.Entry.Organization}}" maxlength="64"></label>
      <label>{{t "books.field.department"}}<input name="department" value="{{$d.Entry.Department}}" maxlength="64"></label>
    </div>
    <div class="grid2">
      <label>{{t "books.field.title"}}<input name="title" value="{{$d.Entry.Title}}" maxlength="64"></label>
      <label>{{t "books.field.email"}}<input name="email" type="email" value="{{$d.Entry.Email}}" maxlength="128" dir="ltr"></label>
    </div>
  </div>
  <div class="card-foot form-actions"><a class="btn" href="/books/{{$d.Book.ID}}">{{t "common.cancel"}}</a><button type="submit" class="btn primary">{{t "common.save"}}</button></div>
</form>
</div>
{{end}}
