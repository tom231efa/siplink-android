{{define "content"}}
<header class="page-head"><div><h1 dir="auto" class="fade">{{.Title}}</h1><p class="page-sub">{{t "clients.preview.masked"}}</p></div>
  <div class="page-actions"><a class="btn" href="/clients/{{.Data.C.ID}}">{{icon "arrow-left"}}{{t "common.back"}}</a></div></header>
{{if .Data.Problems}}<div class="flash error" role="alert">{{t "clients.preview.invalid"}}<ul class="errors">{{range msgs .Data.Problems}}<li>{{.}}</li>{{end}}</ul></div>{{end}}
<section class="card code-card">
  <div class="card-head"><h2><span class="mono">JSON</span></h2><button type="button" class="btn small ghost" data-copy="#doc" hidden>{{icon "copy"}}<span>{{t "common.copy"}}</span></button></div>
  <pre class="mono" id="doc">{{.Data.JSON}}</pre>
</section>
{{end}}
