{{define "content"}}
<div class="narrow-page">
<header class="page-head"><div><h1 dir="auto" class="fade">{{.Data.Title}}</h1></div></header>
{{with .Data.Error}}<div class="flash error" role="alert">{{.}}</div>{{end}}
<form method="post" action="{{.Data.Base}}" class="card form-card">
  <div class="card-body form">
    <label>{{t "common.name"}}<input name="name" value="{{.Data.Name}}" required maxlength="64"></label>
    {{template "region-select" .}}
    <label>{{t "common.note"}}<input name="note" value="{{.Data.Note}}" maxlength="200"></label>
  </div>
  <div class="card-foot form-actions"><a class="btn" href="{{.Data.Base}}">{{t "common.cancel"}}</a><button type="submit" class="btn primary">{{t "common.create"}}</button></div>
</form>
</div>
{{end}}
{{define "region-select"}}
<label>{{t "common.region"}}
  <select name="region">
    {{if .Data.Global}}<option value="0"{{if not .Data.Region}} selected{{end}}>{{t "common.global"}}</option>{{end}}
    {{range .Data.Regions}}<option value="{{.ID}}"{{if eq .ID (deref $.Data.Region)}} selected{{end}}>{{.Name}}</option>{{end}}
  </select>
</label>
{{end}}
