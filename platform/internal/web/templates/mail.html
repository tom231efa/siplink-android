{{define "content"}}
{{$d := .Data}}{{$s := $d.S}}
<div class="narrow-page">
<header class="page-head"><div><h1>邮件</h1></div></header>
<form method="post" action="/mail" class="card form-card">
  <div class="card-head"><h2>{{icon "server"}}SMTP</h2></div>
  <div class="card-body form">
    {{with $d.Error}}<div class="flash error" role="alert">{{.}}</div>{{end}}
    <div class="grid2 domain-port trio">
      <label>服务器<input name="host" value="{{$s.Host}}" maxlength="253" placeholder="smtp.example.com" autocomplete="off" spellcheck="false" required></label>
      <label>端口<input name="port" type="number" min="1" max="65535" value="{{if $s.Port}}{{$s.Port}}{{end}}"></label>
      <label>加密方式
        <select name="security">
          <option value="starttls"{{if or (eq $s.Security "starttls") (not $s.Security)}} selected{{end}}>STARTTLS</option>
          <option value="tls"{{if eq $s.Security "tls"}} selected{{end}}>TLS</option>
          <option value="none"{{if eq $s.Security "none"}} selected{{end}}>不加密</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <label>用户名<input name="username" value="{{$s.Username}}" maxlength="256" autocomplete="off" spellcheck="false"></label>
      <label>密码<input name="password" type="password" autocomplete="new-password" placeholder="{{if $d.PasswordSet}}已设置{{else}}未设置{{end}}"></label>
    </div>
    <div class="grid2">
      <label>发件地址<input name="from_address" type="email" value="{{$s.From}}" maxlength="254" placeholder="noreply@example.com" required></label>
      <label>发件人名称<input name="from_name" value="{{$s.FromName}}" maxlength="64" placeholder="SipLink 管理平台"></label>
    </div>
  </div>
  <div class="card-foot form-actions"><button type="submit" class="btn primary">保存</button></div>
</form>

<section class="card section-gap">
  <div class="card-head"><h2>{{icon "mail"}}发送测试邮件</h2></div>
  <form method="post" action="/mail/test" class="card-body inline-form">
    <input name="to" type="email" value="{{$d.TestTo}}" maxlength="254" placeholder="name@example.com" aria-label="收件地址" required>
    <button type="submit" class="btn">发送</button>
  </form>
  {{with $d.TestError}}<div class="card-body"><div class="flash error" role="alert">发送失败：<span class="mono">{{.}}</span></div></div>{{end}}
</section>
</div>
{{end}}
