{{define "content"}}
{{$d := .Data}}{{$s := $d.S}}
<div class="narrow-page">
<header class="page-head"><div><h1>{{t "nav.mail"}}</h1></div></header>
<form method="post" action="/mail" class="card form-card">
  <div class="card-head"><h2>{{icon "server"}}SMTP</h2></div>
  <div class="card-body form">
    {{with $d.Error}}<div class="flash error" role="alert">{{.}}</div>{{end}}
    <div class="grid2 domain-port trio">
      <label>{{t "mailpage.host"}}<input name="host" value="{{$s.Host}}" maxlength="253" placeholder="smtp.example.com" autocomplete="off" spellcheck="false" required dir="ltr"></label>
      <label>{{t "mailpage.port"}}<input name="port" type="number" min="1" max="65535" value="{{if $s.Port}}{{$s.Port}}{{end}}" dir="ltr"></label>
      <label>{{t "mailpage.security"}}
        <select name="security">
          <option value="starttls"{{if or (eq $s.Security "starttls") (not $s.Security)}} selected{{end}}>STARTTLS</option>
          <option value="tls"{{if eq $s.Security "tls"}} selected{{end}}>TLS</option>
          <option value="none"{{if eq $s.Security "none"}} selected{{end}}>{{t "mailpage.security_none"}}</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <label>{{t "common.username"}}<input name="username" value="{{$s.Username}}" maxlength="256" autocomplete="off" spellcheck="false" dir="ltr"></label>
      <label>{{t "common.password"}}<input name="password" type="password" autocomplete="new-password" placeholder="{{if $d.PasswordSet}}{{t "common.set"}}{{else}}{{t "common.not_set"}}{{end}}"></label>
    </div>
    <div class="grid2">
      <label>{{t "mailpage.from_address"}}<input name="from_address" type="email" value="{{$s.From}}" maxlength="254" placeholder="noreply@example.com" required dir="ltr"></label>
      <label>{{t "mailpage.from_name"}}<input name="from_name" value="{{$s.FromName}}" maxlength="64" placeholder="{{t "app.name"}}"></label>
    </div>
  </div>
  <div class="card-foot form-actions"><button type="submit" class="btn primary">{{t "common.save"}}</button></div>
</form>

<section class="card section-gap">
  <div class="card-head"><h2>{{icon "mail"}}{{t "mailpage.test.title"}}</h2></div>
  <form method="post" action="/mail/test" class="card-body inline-form">
    <input name="to" type="email" value="{{$d.TestTo}}" maxlength="254" placeholder="name@example.com" aria-label="{{t "mailpage.test.to"}}" required dir="ltr">
    <button type="submit" class="btn">{{t "mailpage.test.send"}}</button>
  </form>
  {{with $d.TestError}}<div class="card-body"><div class="flash error" role="alert">{{.}}</div></div>{{end}}
</section>
</div>
{{end}}
