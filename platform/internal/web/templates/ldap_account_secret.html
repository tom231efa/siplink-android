{{define "content"}}
<div class="narrow-page">
<header class="page-head"><div><h1 dir="auto" class="fade">{{.Title}}</h1></div></header>
<section class="card secret-card">
  <div class="card-body">
    <dl class="kv">
      <dt>Bind DN</dt><dd class="mono">{{.Data.BindDN}}</dd>
    </dl>
    <span class="card-label spaced-label">{{t "common.password"}}</span>
    <div class="secret-row"><span class="secret-once" id="once">{{.Data.Password}}</span><button type="button" class="btn" data-copy="#once" hidden>{{icon "copy"}}<span>{{t "common.copy"}}</span></button></div>
    <div class="flash warn">{{t "dirs.ldap.password_once"}}</div>
  </div>
  <div class="card-foot form-actions"><a class="btn" href="/ldap-accounts">{{t "dirs.ldap.back"}}</a></div>
</section>
</div>
{{end}}
