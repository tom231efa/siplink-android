{{define "content"}}
<div class="narrow-page">
<header class="page-head"><div><h1 class="fade">{{.Title}}</h1></div></header>
<section class="card secret-card">
  <div class="card-body">
    <dl class="kv">
      <dt>Bind DN</dt><dd class="mono">{{.Data.BindDN}}</dd>
    </dl>
    <span class="card-label spaced-label">密码</span>
    <div class="secret-row"><span class="secret-once" id="once">{{.Data.Password}}</span><button type="button" class="btn" data-copy="#once" hidden>{{icon "copy"}}<span>复制</span></button></div>
    <div class="flash warn">密码仅显示一次，遗失后须重置。</div>
  </div>
  <div class="card-foot form-actions"><a class="btn" href="/ldap-accounts">返回 LDAP 账号</a></div>
</section>
</div>
{{end}}
