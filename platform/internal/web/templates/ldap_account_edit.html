{{define "content"}}
{{$d := .Data}}
<div class="narrow-page">
<header class="page-head"><div><h1 class="fade">{{.Title}}</h1></div></header>
{{with $d.Error}}<div class="flash error" role="alert">{{.}}</div>{{end}}
<form method="post" action="{{if $d.New}}/ldap-accounts{{else}}/ldap-accounts/{{$d.Account.ID}}{{end}}" class="card form-card">
  <div class="card-body form">
    {{if $d.New}}
    <label>账号名<input name="name" value="{{$d.Account.Name}}" required pattern="[a-z0-9-]{2,32}" maxlength="32" class="mono" placeholder="desk-reader" title="2-32 个小写字母、数字或 -" autocomplete="off"></label>
    {{else}}
    <label>Bind DN<input value="{{$d.BindDN}}" disabled class="mono"></label>
    {{end}}
    {{if or $d.New .Super}}
    <label>区域
      <select name="region">
        {{if $d.Global}}<option value="0"{{if not $d.Account.RegionID}} selected{{end}}>全局</option>{{end}}
        {{range $d.Regions}}<option value="{{.ID}}"{{if eq .ID (deref $d.Account.RegionID)}} selected{{end}}>{{.Name}}</option>{{end}}
      </select>
    </label>
    {{end}}
    <fieldset class="plain">
      <legend class="field-label">可读取的通讯录</legend>
      {{if $d.Books}}<div class="check-list">
      {{range $d.Books}}<label class="check-row"><input type="checkbox" name="books" value="{{.ID}}"{{if hasID $d.Account.BookIDs .ID}} checked{{end}}>
        <span class="fade">{{.Name}}</span><span class="muted fade">{{with .RegionID}}{{index $d.RegionOf (deref .)}}{{else}}全局{{end}} · <span class="mono">{{.Slug}}</span></span></label>{{end}}
      </div>{{else}}<p class="muted">暂无可用通讯录</p>{{end}}
    </fieldset>
    <label>备注<input name="note" value="{{$d.Account.Note}}" maxlength="200"></label>
    {{if not $d.New}}<label class="setting toggle"><span class="setting-text"><span class="setting-name">停用</span></span>
      <span class="switch"><input type="checkbox" role="switch" name="disabled" value="1"{{if $d.Account.Disabled}} checked{{end}}><span></span></span></label>{{end}}
  </div>
  <div class="card-foot form-actions"><a class="btn" href="/ldap-accounts">取消</a><button type="submit" class="btn primary">保存</button></div>
</form>
{{if not $d.New}}
<section class="card danger-card">
  <div class="op-list">
    <form method="post" action="/ldap-accounts/{{$d.Account.ID}}/reset" class="op" data-confirm="确认重置「{{$d.Account.Name}}」的密码？使用原密码的设备将无法登录。">
      <div><strong>重置密码</strong></div>
      <button type="submit" class="btn small">{{icon "key-round"}}重置密码</button>
    </form>
    <form method="post" action="/ldap-accounts/{{$d.Account.ID}}/delete" class="op" data-confirm="确认删除 LDAP 账号「{{$d.Account.Name}}」？">
      <div><strong>删除账号</strong></div>
      <button type="submit" class="btn small danger">{{icon "trash"}}删除账号</button>
    </form>
  </div>
</section>
{{end}}
</div>
{{end}}
