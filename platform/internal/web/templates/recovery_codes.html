{{define "content"}}
<div class="narrow-page">
<header class="page-head"><div><h1>{{t "twostep.recovery_codes"}}</h1></div></header>
<section class="card secret-card">
  <div class="card-body">
    <ul class="recovery-codes" id="recovery-codes" dir="ltr">{{range .Data.Codes}}
      <li>{{.}}</li>{{end}}
    </ul>
    <div class="secret-row"><button type="button" class="btn" data-copy="#recovery-codes" hidden>{{icon "copy"}}<span>{{t "common.copy"}}</span></button></div>
    <div class="flash warn">{{t "me.recovery.once"}}</div>
  </div>
  <form method="post" action="/me/recovery/done" class="card-foot form-actions"><input type="hidden" name="t" value="{{.Data.Token}}"><button type="submit" class="btn primary">{{t "common.done"}}</button></form>
</section>
</div>
{{end}}
